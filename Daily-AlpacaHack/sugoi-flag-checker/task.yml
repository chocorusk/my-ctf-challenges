description: |
  A super flag checker that uses a super cryptographic algorithm.

  <details>
  <summary>Beginner Hint①</summary>

  - `chal` は ELF 実行ファイルです。まずは、[IDA Free](https://hex-rays.com/ida-free), [Ghidra](https://github.com/NationalSecurityAgency/ghidra), [Binary Ninja](https://binary.ninja/) などのリバースエンジニアリングツールでデコンパイルしてみましょう。
  - また、この問題の難易度は **Hard** なので、初心者の方は適宜 AI を活用することをおすすめします。
  - 例えば、 ChatGPT にはバイナリをドラッグ・アンド・ドロップで添付でき、解析を手伝ってくれます。

  </details>

  <details>
  <summary>Beginner Hint② (ネタバレ注意！)</summary>

  - 実は、暗号処理をほとんど理解しなくてもこの問題を解くことができます。
  - `strcmp` 関数でどんな文字列を比較しているかに着目してみてください。

  </details>

